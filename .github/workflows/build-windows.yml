# Build the Volo Browser v1.1.0 Windows NSIS installer on a real Windows
# runner and publish it to the existing GitHub Release v1.1.0.
#
# Why this workflow exists: the build VM has no wine, so a local NSIS build
# is blocked. A Windows runner builds the installer natively.
#
# Trigger: by hand from the Actions tab (workflow_dispatch) on main.
# electron-builder --publish always uploads the installer
# (Volo Browser-Setup-1.1.0.exe) plus latest.yml into the existing v1.1.0
# release (it reuses the release if the tag already exists). latest.yml is
# the feed the in-app updater reads, so the Update button can find 1.1.0.
# No Apple certificate needed here (Windows only, unsigned installer).

name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build NSIS installer and publish to Release v1.1.0
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
